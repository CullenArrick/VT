[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    Z_TILT_ADJUST
    G28
    G0 X125 Y125 Z30 F3600
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
# Generated by "A better print_start macro wizard"
# Generated on: 2026-11-04 14:55:11
# Configuration:
#   - Printer: Voron Trident
#   - Probe: Beacon with 0.06 offset
#   - Slicer: OrcaSlicer
#   - Status text
#   - Purge line
#   - Bed mesh: adaptive
#   - Stealthburner LEDs

# OrcaSlicer start G-code (backup reference):
#   M104 S0 ; Cancel slicer-injected heating so PRINT_START controls it
#   M140 S0 ; Cancel slicer-injected heating so PRINT_START controls it
#   print_start EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] OFFSET=0.06

gcode:
  # ---------- Read parameters passed in from the slicer ----------
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_offset = params.OFFSET|default("0.06")|float %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # ---------- Reset Z offset before homing (probe needs a clean baseline) ----------
  SET_GCODE_OFFSET Z=0

  # ---------- Clear any previous pause state and home all axes ----------
  CLEAR_PAUSE
  STATUS_HOMING
  G28
  G90

  # ---------- Clear old bed mesh so a fresh one can be generated later ----------
  BED_MESH_CLEAR

  # ---------- Heat the bed and do a quick heat soak ----------
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M190 S{target_bed}
  SET_DISPLAY_TEXT MSG="Soak for 5 min"
  #G4 P300000

  # ---------- Pre-heat hotend to a probe-safe temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: 150c"
  M109 S150

  # ---------- Probe contact Z calibration (temperature compensated) ----------
  G28 Z METHOD=CONTACT CALIBRATE=1

  # ---------- Level the bed relative to the gantry, then re-home Z ----------
  SET_DISPLAY_TEXT MSG="Leveling"
  STATUS_LEVELING
  Z_TILT_ADJUST
  G28 Z

  # ---------- Generate a fresh bed mesh at print temperatures ----------
  SET_DISPLAY_TEXT MSG="Bed mesh"
  STATUS_MESHING
  BED_MESH_CALIBRATE ADAPTIVE=1

  # ---------- Final Z reference using probe contact ----------
  G28 Z METHOD=CONTACT CALIBRATE=0

  # ---------- Heat hotend to print temperature ----------
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"
  STATUS_HEATING
  G1 X{x_wait} Y{y_wait} Z15 F9000
  M107
  M109 S{target_extruder}

  # ---------- Apply final Z offset for the probe ----------
  SET_GCODE_OFFSET Z={target_offset}

  # ---------- Purge / prime line, then hand off to the print ----------
  SET_DISPLAY_TEXT MSG="Printer goes brr"
  STATUS_PRINTING
  G0 X{x_wait - 50} Y4 F10000
  G0 Z0.4
  G91
  G1 X100 E20 F1000
  G90
   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


