# This file stores the flash_commands for each mcus
# Previous version KCONFIG_CONFIG was needed now it is automaticly added when make flash is called
# version : 0.2
# tested/supported flash methods :
#  - make flash
#  - sdcard_flash
#  - flashtool.py
#  - mount/cp/umount (for rp2040)
#  - external scripts ...

[Leviathan]
klipper_section: mcu
config_name: Leviathan
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-Klipper_stm32h743xx_370049000A51323236393838-if00
action_command: python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_stm32h743xx_370049000A51323236393838-if00

[NH36]
klipper_section: mcu nhk
config_name: NH36
quiet_command: enter_bootloader -t usb -d /dev/serial/by-id/usb-katapult_rp2040_4E363334320F8B57-if00
action_command: cp ~/klipper/out/klipper.uf2 ~/klipper/out/klipper.bin && python3 ~/katapult/scripts/flashtool.py -d /dev/serial/by-id/usb-katapult_rp2040_4E363334320F8B57-if00



[beacon]
is_klipper_fw: false
quiet_command: sudo systemctl stop klipper
action_command: git -C ~/beacon_klipper pull
action_command: ~/beacon_klipper/update_firmware.py update all
